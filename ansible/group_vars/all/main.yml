---
username: "wh0am1"

app_name: bulletin-board
docker_image: nxdeep/project-devops-deploy
app_image_tag: "{{ image_tag | default('latest') }}"

app_deploy_dir: /opt/bulletin-board
app_data_dir: "{{ app_deploy_dir }}/data"
app_logs_dir: "{{ app_deploy_dir }}/logs"

app_http_port: 8080
app_management_port: 9090

s3_bucket_name: bulletins-obs-p4-zayats
s3_region: ru-central1
s3_endpoint: https://storage.yandexcloud.net

db_host: rc1d-92emca79dukk8kgh.mdb.yandexcloud.net
db_port: 6432
db_name: bulletins
db_user: bulletins

node_exporter_version: "1.12.1"
node_exporter_port: 9100

metrics_user: prometheus

monitoring_allowed_cidr: "10.131.0.18/32"

app_private_ip: "10.130.0.22"
monitoring_dir: /opt/monitoring
prometheus_image: "prom/prometheus:v3.13.2"
prometheus_port: 9090
prometheus_retention: 15d
prometheus_web_user: reviewer

prometheus_scrape_jobs:
  - name: node
    targets: ["{{ app_private_ip }}:{{ node_exporter_port }}"]
  - name: app-actuator
    metrics_path: /actuator/prometheus
    basic_auth: true
    targets: ["{{ app_private_ip }}:{{ app_management_port }}"]
  - name: nginx
    targets: ["{{ app_private_ip }}:{{ nginx_exporter_port }}"]

grafana_image: "grafana/grafana:12.0.0"
grafana_port: 3000
grafana_admin_user: admin
grafana_anonymous_enabled: true

grafana_root_url: "http://93.77.167.172:3000/"
smtp_host: "smtp.yandex.ru:465"
smtp_from_name: "Grafana Alerts"

nginx_exporter_version: "1.5.3"
nginx_exporter_port: 9113
nginx_stub_status_port: 8081
