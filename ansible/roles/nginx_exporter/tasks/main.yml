- name: Create nginx_exporter system user
  ansible.builtin.user:
    name: nginx_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download nginx-prometheus-exporter archive
  ansible.builtin.get_url:
    url: "{{ nginx_exporter_base_url }}/{{ nginx_exporter_archive }}"
    dest: "/tmp/{{ nginx_exporter_archive }}"
    mode: "0644"

- name: Create directory for unpacking
  ansible.builtin.file:
    path: "{{ nginx_exporter_unpack_dir }}"
    state: directory
    mode: "0755"

- name: Unpack archive
  ansible.builtin.unarchive:
    src: "/tmp/{{ nginx_exporter_archive }}"
    dest: "{{ nginx_exporter_unpack_dir }}"
    remote_src: true
    creates: "{{ nginx_exporter_unpack_dir }}/nginx-prometheus-exporter"

- name: Install nginx-prometheus-exporter binary
  ansible.builtin.copy:
    src: "{{ nginx_exporter_unpack_dir }}/nginx-prometheus-exporter"
    dest: /usr/local/bin/nginx-prometheus-exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart nginx_exporter

- name: Install systemd unit
  ansible.builtin.template:
    src: nginx_exporter.service.j2
    dest: /etc/systemd/system/nginx_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx_exporter

- name: Enable and start nginx_exporter
  ansible.builtin.systemd:
    name: nginx_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Allow nginx_exporter port from the monitoring network only
  community.general.ufw:
    rule: allow
    port: "{{ nginx_exporter_port }}"
    proto: tcp
    src: "{{ monitoring_allowed_cidr }}"
