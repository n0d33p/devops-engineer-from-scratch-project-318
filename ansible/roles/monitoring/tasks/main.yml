- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}"
    - "{{ monitoring_dir }}/prometheus"
    - "{{ monitoring_dir }}/prometheus/config"
    - "{{ monitoring_dir }}/prometheus/config/rules"
    - "{{ monitoring_dir }}/prometheus/config/secrets"
    - "{{ monitoring_dir }}/grafana"
    - "{{ monitoring_dir }}/grafana/provisioning"
    - "{{ monitoring_dir }}/grafana/provisioning/datasources"
    - "{{ monitoring_dir }}/grafana/provisioning/dashboards"
    - "{{ monitoring_dir }}/grafana/dashboards"

- name: Write prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/config/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Copy alert rules
  ansible.builtin.copy:
    src: alerts.yml
    dest: "{{ monitoring_dir }}/prometheus/config/rules/alerts.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Write web config with the basic-auth hash
  ansible.builtin.template:
    src: web.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/config/web.yml"
    owner: "65534"
    group: "65534"
    mode: "0400"
  no_log: true
  notify: Restart monitoring stack

- name: Write the password used to scrape the application metrics
  ansible.builtin.copy:
    content: "{{ vault_metrics_password }}"
    dest: "{{ monitoring_dir }}/prometheus/config/secrets/metrics_password"
    owner: "65534"
    group: "65534"
    mode: "0400"
  no_log: true
  notify: Restart monitoring stack

- name: Write Grafana datasources provisioning
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasources.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Write Grafana dashboards provider
  ansible.builtin.copy:
    src: grafana-dashboards-provider.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/provider.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Write the compose env file with Grafana secrets
  ansible.builtin.template:
    src: monitoring.env.j2
    dest: "{{ monitoring_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart monitoring stack

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Create Loki directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}/loki"
    - "{{ monitoring_dir }}/loki/config"

- name: Create Loki data directory owned by the Loki user
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/loki/data"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0755"

- name: Write Loki config
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ monitoring_dir }}/loki/config/loki.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart monitoring stack

- name: Start the monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present

- name: Wait for Prometheus to answer
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_port }}/-/healthy"
    status_code: [200, 401]
  register: monitoring_health
  retries: 10
  delay: 5
  until: monitoring_health.status in [200, 401]

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ monitoring_dir }}/grafana/dashboards/"
    owner: root
    group: root
    mode: "0644"
  tags: dashboards

- name: Create Grafana alerting provisioning directory
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/grafana/provisioning/alerting"
    state: directory
    mode: "0755"
  tags: dashboards

- name: Copy Grafana alerting provisioning (contact points, policies, rules)
  ansible.builtin.copy:
    src: grafana-alerting/
    dest: "{{ monitoring_dir }}/grafana/provisioning/alerting/"
    owner: root
    group: root
    mode: "0644"
  notify: Restart grafana
  tags: dashboards

- name: Wait for Loki to be ready
  ansible.builtin.uri:
    url: "http://{{ ansible_default_ipv4.address }}:{{ loki_port }}/ready"
    status_code: 200
  register: monitoring_loki_ready
  retries: 12
  delay: 5
  until: monitoring_loki_ready.status == 200
