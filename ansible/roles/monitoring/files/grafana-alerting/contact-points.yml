apiVersion: 1
contactPoints:
  - orgId: 1
    name: email-oncall
    receivers:
      - uid: email-oncall
        type: email
        settings:
          addresses: $ALERT_EMAIL_TO
          singleEmail: false
policies:
  - orgId: 1
    receiver: email-oncall
    group_by: ["alertname", "service"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
