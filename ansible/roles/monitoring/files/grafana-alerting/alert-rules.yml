{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "availability",
      "folder": "Observability",
      "interval": "1m",
      "rules": [
        {
          "uid": "app-down",
          "title": "Приложение недоступно",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "up{job=\"app-actuator\"}",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "2m",
          "annotations": {
            "summary": "Приложение недоступно ({{ $labels.instance }})",
            "description": "Prometheus не может опросить Actuator уже 2 минуты: контейнер упал или Nginx не отвечает."
          },
          "labels": {
            "severity": "critical",
            "service": "app"
          },
          "isPaused": false
        },
        {
          "uid": "node-exporter-down",
          "title": "Node Exporter недоступен",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "up{job=\"node\"}",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "2m",
          "annotations": {
            "summary": "Node Exporter недоступен ({{ $labels.instance }})",
            "description": "Метрики хоста не собираются 2 минуты: сервис упал или сервер недоступен по сети."
          },
          "labels": {
            "severity": "critical",
            "service": "host"
          },
          "isPaused": false
        },
        {
          "uid": "services-down",
          "title": "Системный сервис остановлен",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "node_systemd_unit_state{state=\"active\", name=~\"nginx.service|docker.service\"}",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "lt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "2m",
          "annotations": {
            "summary": "Сервис {{ $labels.name }} остановлен",
            "description": "Сервис {{ $labels.name }} не в состоянии active на {{ $labels.instance }} дольше 2 минут."
          },
          "labels": {
            "severity": "critical",
            "service": "host"
          },
          "isPaused": false
        },
        {
          "uid": "metrics-missing",
          "title": "Метрики перестали поступать",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "absent(node_load1) or absent(process_uptime_seconds)",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "Нет метрик хоста или приложения",
            "description": "Prometheus не видит метрик node_load1 или process_uptime_seconds уже 5 минут."
          },
          "labels": {
            "severity": "warning",
            "service": "monitoring"
          },
          "isPaused": false
        }
      ]
    },
    {
      "orgId": 1,
      "name": "application",
      "folder": "Observability",
      "interval": "1m",
      "rules": [
        {
          "uid": "high-5xx",
          "title": "Много ответов 5xx",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "(sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count[5m]))",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.05
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "Доля ответов 5xx выше 5%",
            "description": "Больше 5% запросов к приложению заканчиваются ошибкой 5xx уже 5 минут."
          },
          "labels": {
            "severity": "critical",
            "service": "app"
          },
          "isPaused": false
        },
        {
          "uid": "high-latency-p95",
          "title": "Высокая задержка ответов",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        1
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "p95 задержки выше 1 секунды",
            "description": "95% запросов обрабатываются дольше 1 секунды уже 5 минут."
          },
          "labels": {
            "severity": "warning",
            "service": "app"
          },
          "isPaused": false
        }
      ]
    },
    {
      "orgId": 1,
      "name": "resources",
      "folder": "Observability",
      "interval": "1m",
      "rules": [
        {
          "uid": "high-cpu",
          "title": "Высокая загрузка CPU",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        85
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "10m",
          "annotations": {
            "summary": "CPU загружен больше чем на 85%",
            "description": "Загрузка процессора выше 85% уже 10 минут."
          },
          "labels": {
            "severity": "warning",
            "service": "host"
          },
          "isPaused": false
        },
        {
          "uid": "high-memory",
          "title": "Мало свободной памяти",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        90
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "10m",
          "annotations": {
            "summary": "Занято больше 90% памяти",
            "description": "Память на {{ $labels.instance }} занята больше чем на 90% уже 10 минут."
          },
          "labels": {
            "severity": "warning",
            "service": "host"
          },
          "isPaused": false
        },
        {
          "uid": "low-disk",
          "title": "Заканчивается место на диске",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "expr": "(1 - node_filesystem_avail_bytes{mountpoint=\"/\", fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!~\"tmpfs|overlay\"}) * 100",
                "instant": true,
                "range": false,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "reduce",
                "expression": "A",
                "reducer": "last",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "type": "threshold",
                "expression": "B",
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        85
                      ]
                    }
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "5m",
          "annotations": {
            "summary": "Диск заполнен больше чем на 85%",
            "description": "Корневой раздел на {{ $labels.instance }} заполнен больше чем на 85%."
          },
          "labels": {
            "severity": "warning",
            "service": "host"
          },
          "isPaused": false
        }
      ]
    }
  ]
}
