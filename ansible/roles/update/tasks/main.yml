---
- name: Re-render docker-compose-yml for the requested image tag
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/deploy/templates/docker-compose.yml.j2"
    dest: "{{ app_deploy_dir }}/docker-compose.yml"
    owner: "{{ username }}"
    group: docker
    mode: "0640"

- name: Pull the requested image tag
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ app_image_tag }}"
    source: pull
    force_source: true
  register: update_pulled

- name: Recreate the container
  community.docker.docker_compose_v2:
    project_src: "{{ app_deploy_dir }}"
    state: present
    recreate: always
  when: update_pulled.changed

- name: Wait for the app to report healthy after the swap
  ansible.builtin.uri:
    url: "http://localhost:{{ app_management_port }}/actuator/health"
    status_code: 200
  register: update_health
  retries: 10
  delay: 5
  until: update_health.status == 200

- name: Record currently deployed version
  ansible.builtin.copy:
    content: "{{ app_image_tag }}\n"
    dest: "{{ app_deploy_dir }}/CURRENT_VERSION"
    owner: "{{ username }}"
    group: docker
    mode: "0644"
