---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install docker via geerlingguy.docker role
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_install_compose_plugin: true

- name: Install python3-docker (required by community.docker modules)
  ansible.builtin.apt:
    name: python3-docker
    state: present

- name: Add user
  ansible.builtin.user:
    name: "{{ username }}"
    groups: [docker]
    append: true
    password: "{{ user_password | password_hash('sha512', vault_password_salt) }}"
  tags: user

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow HTTP/HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Enable ufw and deny default
  community.general.ufw:
    state: enabled
    policy: deny
