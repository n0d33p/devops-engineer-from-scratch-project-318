---
- name: Create deploy directory
  ansible.builtin.file:
    path: "{{ app_deploy_dir }}"
    state: directory
    owner: "{{ username }}"
    group: docker
    mode: "0750"

- name: Create persistent data directory (survives container restarts)
  ansible.builtin.file:
    path: "{{ app_data_dir }}"
    state: directory
    owner: "{{ username }}"
    group: docker
    mode: "0750"

- name: Create persistent logs directory
  ansible.builtin.file:
    path: "{{ app_logs_dir }}"
    state: directory
    owner: "{{ username }}"
    group: docker
    mode: "0750"

- name: Write docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_deploy_dir }}/docker-compose.yml"
    owner: "{{ username }}"
    group: docker
    mode: "0640"
  notify: Recreate app container

- name: Write environment file with app secrets
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_deploy_dir }}/.env"
    owner: "{{ username }}"
    group: docker
    mode: "0600"
  notify: Recreate app container

- name: Pull the configured image tag
  community.docker.docker_image:
    name: "{{ docker_image }}:{{ app_image_tag }}"
    source: pull
    force_source: true

- name: Make sure the stack is up
  community.docker.docker_compose_v2:
    project_src: "{{ app_deploy_dir }}"
    state: present

- name: Apply pending compose/env changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for the app to report healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ app_management_port }}/actuator/health"
    status_code: 200
  register: deploy_health
  retries: 10
  delay: 5
  until: deploy_health.status == 200

- name: Record currently deployed version
  ansible.builtin.copy:
    content: "{{ app_image_tag }}\n"
    dest: "{{ app_deploy_dir }}/CURRENT_VERSION"
    owner: "{{ username }}"
    group: docker
    mode: "0644"
